<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser tools for images, PDFs, audio, video, random numbers, time, math and text. Everything runs locally, nothing is uploaded." />
    <title>Tools</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Restore clean URL from 404.html redirect
      {
        const l = window.location;
        if (l.search[1] === '/') {
          const decoded = l.search.slice(1).split('&').map((s) => s.replace(/~and~/g, '&')).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
